<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport">
    <title>Booking</title>
</head>
<body>
<header class="header">
    <h1>Booking</h1>
    <nav class="nav">
        <ul class="nav-list">
            <li><a href="index.html">Home</a></li>
            <li><a href="movies.html">Movies</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>
<main class="booking-container">
    <h2 class="booking-title">Booking: Forrest Gump</h2>
    <p class="booking-hall-time">Hall 1 - 19:30</p>
    <div class="screen">
        <p></p>
    </div>
    <div class="cinema-hall">
        <button type="button" class="seat" aria-label="Row 1, Seat 1"></button>
        <button type="button" class="seat" aria-label="Row 1, Seat 2"></button>
        <button type="button" class="seat" aria-label="Row 1, Seat 3"></button>
        <button type="button" class="seat occupied" aria-label="Row 1, Seat 4"></button>
        <button type="button" class="seat occupied" aria-label="Row 1, Seat 5"></button>
        <button type="button" class="seat" aria-label="Row 1, Seat 6"></button>
        <button type="button" class="seat" aria-label="Row 1, Seat 7"></button>
        <button type="button" class="seat" aria-label="Row 1, Seat 8"></button>
        <button type="button" class="seat" aria-label="Row 2, Seat 1"></button>
        <button type="button" class="seat" aria-label="Row 2, Seat 2"></button>
        <button type="button" class="seat occupied" aria-label="Row 2, Seat 3"></button>
        <button type="button" class="seat occupied" aria-label="Row 2, Seat 4"></button>
        <button type="button" class="seat" aria-label="Row 2, Seat 5"></button>
        <button type="button" class="seat" aria-label="Row 2, Seat 6"></button>
        <button type="button" class="seat" aria-label="Row 2, Seat 7"></button>
        <button type="button" class="seat" aria-label="Row 2, Seat 8"></button>
        <button type="button" class="seat" aria-label="Row 3, Seat 1"></button>
        <button type="button" class="seat" aria-label="Row 3, Seat 2"></button>
        <button type="button" class="seat" aria-label="Row 3, Seat 3"></button>
        <button type="button" class="seat" aria-label="Row 3, Seat 4"></button>
        <button type="button" class="seat" aria-label="Row 3, Seat 5"></button>
        <button type="button" class="seat" aria-label="Row 3, Seat 6"></button>
        <button type="button" class="seat occupied" aria-label="Row 3, Seat 7"></button>
        <button type="button" class="seat" aria-label="Row 3, Seat 8"></button>
        <button type="button" class="seat occupied" aria-label="Row 4, Seat 1"></button>
        <button type="button" class="seat occupied" aria-label="Row 4, Seat 2"></button>
        <button type="button" class="seat occupied" aria-label="Row 4, Seat 3"></button>
        <button type="button" class="seat" aria-label="Row 4, Seat 4"></button>
        <button type="button" class="seat occupied" aria-label="Row 4, Seat 5"></button>
        <button type="button" class="seat occupied" aria-label="Row 4, Seat 6"></button>
        <button type="button" class="seat" aria-label="Row 4, Seat 7"></button>
        <button type="button" class="seat" aria-label="Row 4, Seat 8"></button>
        <button type="button" class="seat" aria-label="Row 5, Seat 1"></button>
        <button type="button" class="seat" aria-label="Row 5, Seat 2"></button>
        <button type="button" class="seat" aria-label="Row 5, Seat 3"></button>
        <button type="button" class="seat" aria-label="Row 5, Seat 4"></button>
        <button type="button" class="seat" aria-label="Row 5, Seat 5"></button>
        <button type="button" class="seat" aria-label="Row 5, Seat 6"></button>
        <button type="button" class="seat" aria-label="Row 5, Seat 7"></button>
        <button type="button" class="seat" aria-label="Row 5, Seat 8"></button>
        <button type="button" class="seat" aria-label="Row 6, Seat 1"></button>
        <button type="button" class="seat" aria-label="Row 6, Seat 2"></button>
        <button type="button" class="seat" aria-label="Row 6, Seat 3"></button>
        <button type="button" class="seat" aria-label="Row 6, Seat 4"></button>
        <button type="button" class="seat" aria-label="Row 6, Seat 5"></button>
        <button type="button" class="seat occupied" aria-label="Row 6, Seat 6"></button>
        <button type="button" class="seat occupied" aria-label="Row 6, Seat 7"></button>
        <button type="button" class="seat" aria-label="Row 6, Seat 8"></button>
    </div>
    <div class="legend">
        <div class="legend-item">
            <span class="seat">Available</span>
        </div>
        <div class="legend-item">
            <span class="seat selected">Selected</span>
        </div>
        <div class="legend-item">
            <span class="seat occupied">Occupied</span>
        </div>
    </div>
    <div class="booking-summary">
        <p class="booking-summary-text">You have selected <span id="count">0</span> seats for a price of <span
                id="total">0</span>$</p>
        <button type="button" class="btn btn-primary">Confirm Booking</button>
    </div>
</main>
<script src="booking.js"></script>
</body>
</html>
