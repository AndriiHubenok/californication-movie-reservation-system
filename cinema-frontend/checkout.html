<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport">
    <title>Checkout</title>
</head>
<body>
<header class="header">
    <h1>Cinema</h1>
    <nav class="nav">
        <ul class="nav-list">
            <li id="auth-nav-item"><a href="login.html">Login</a></li>
            <li><a href="index.html">Home</a></li>
            <li><a href="movies.html">Movies</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>
<main class="checkout-container">
    <div class="order-summary">
        <h2 id="order-summary-title">Order Summary</h2>
        <h3 id="order-summary-movie-title">Loading...</h3>
        <p id="order-summary-hall-time"></p>
        <p id="order-summary-seats"></p>
        <p id="order-summary-total"></p>
    </div>
    <form id="checkout-form" novalidate>
        <div class="form-group">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Sashko Shevchenko" required>
            <span class="error-message" id="fullName-error"></span>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="alex@example.com" required>
            <span class="error-message" id="email-error"></span>
        </div>
        <div class="form-group">
            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" placeholder="+49XXXXXXXXX" required>
            <span class="error-message" id="phone-error"></span>
        </div>
        <div class="form-group-checkbox">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the booking and ticket return terms</label>
            <span class="error-message" id="terms-error"></span>
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">Pay</button>
    </form>
</main>
<script type="module" src="login.js"></script>
<script type="module" src="checkout.js"></script>
</body>
</html>
