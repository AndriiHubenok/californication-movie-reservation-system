<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <style>
        @page {
            size: 85mm 160mm;
            margin: 0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .header {
            text-align: center;
            border-bottom: 2px dashed #333333;
            padding-bottom: 12px;
        }

        .cinema-name {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e50914;
            font-weight: bold;
        }

        .movie-title {
            font-size: 18px;
            font-weight: bold;
            margin: 8px 0 4px;
        }

        .session-info {
            font-size: 12px;
            color: #a0a0a0;
        }

        .details-grid {
            margin: 16px 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 12px;
        }

        .detail-item {
            background-color: #1f1f1f;
            padding: 8px;
            border-radius: 4px;
        }

        .detail-label {
            color: #888888;
            font-size: 10px;
            text-transform: uppercase;
        }

        .detail-value {
            font-weight: bold;
            margin-top: 2px;
        }

        .seats-container {
            margin-top: 8px;
            padding: 8px;
            background: #1f1f1f;
            border-radius: 4px;
            font-size: 12px;
        }

        .qr-section {
            text-align: center;
            border-top: 2px dashed #333333;
            padding-top: 12px;
            margin-top: auto;
        }

        .qr-image {
            width: 110px;
            height: 110px;
            background: #ffffff;
            padding: 4px;
            border-radius: 6px;
        }

        .ticket-code {
            font-family: monospace;
            font-size: 11px;
            color: #777777;
            margin-top: 6px;
        }
    </style>
</head>
<body>
<div class="header">
    <div class="cinema-name">{{ cinema.name }}</div>
    <div class="movie-title">{{ movie.title }}</div>
    <div class="session-info">{{ showtime.start_time|date:"d.m.Y — H:i" }}</div>
    <div class="session-info">{{ showtime.end_time|date:"d.m.Y — H:i" }}</div>
</div>

<div class="details-grid">
    <div class="detail-item">
        <div class="detail-label">Hall</div>
        <div class="detail-value">{{ hall.name }}</div>
    </div>
</div>

<div class="seats-container">
    <div class="detail-label">Seats</div>
    <div class="detail-value">
        Row {{ seat.row }}, Seat {{ seat.number }}
    </div>
</div>

<div class="qr-section">
    <img class="qr-image" src="{{ qr_code_uri }}" alt="QR Code" />
    <div class="ticket-code">#{{ reservation.id }}</div>
</div>
</body>
</html>
