services:
  backend:
    build: .
    env_file:
      - .env
    command: >
      sh -c "python manage.py makemigrations &&
              python manage.py migrate &&
              python manage.py runserver 0.0.0.0:8000"
    ports:
      - '8000:8000'
    depends_on:
      - postgres
      - rabbitmq

  postgres:
    image: 'postgis/postgis:17-3.4'
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - movie_data:/var/lib/postgresql/data

  rabbitmq:
    image: 'rabbitmq:3-management'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - '5672:5672'
      - '15672:15672'

  celery:
    build: .
    env_file:
      - .env
    command: celery -A cinema_config worker --loglevel=info
    depends_on:
      - postgres
      - rabbitmq
      - backend

  stripe-cli:
    image: 'stripe/stripe-cli:latest'
    environment:
      - STRIPE_API_KEY=${STRIPE_API_KEY}
    command: listen --forward-to http://backend:8000/api/webhook/stripe/
    depends_on:
      - backend

  minio:
    image: 'minio/minio'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - movie_data:/data

  minio-client:
    image: 'minio/mc:latest'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      sleep 5;
      
      /usr/bin/mc alias set dockerminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      
      /usr/bin/mc mb dockerminio/$${AWS_STORAGE_BUCKET_NAME} || true;
      
      /usr/bin/mc anonymous set download dockerminio/$${AWS_STORAGE_BUCKET_NAME};
      
      echo 'MinIO initialization completed.';
      "
    depends_on:
      - minio

volumes:
  movie_data: